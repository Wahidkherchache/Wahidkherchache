<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="agkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="50%" stop-color="#2a0505"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="agkStripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3B3B" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF3B3B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF3B3B" stop-opacity="0"/>
    </linearGradient>
    <pattern id="agkGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FF3B3B" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="agkGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" fill="url(#agkBg)"/>
  <rect width="1200" height="280" fill="url(#agkGrid)"/>

  <!-- moving light sweep -->
  <rect x="-300" y="0" width="300" height="280" fill="url(#agkStripe)">
    <animate attributeName="x" from="-300" to="1200" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- animated racing line -->
  <path d="M -100 235 L 1300 235" stroke="#FF3B3B" stroke-width="2" stroke-dasharray="22 16" opacity="0.55">
    <animate attributeName="stroke-dashoffset" from="0" to="-760" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- corner telemetry labels -->
  <text x="40" y="36" font-family="monospace" font-size="13" fill="#CC0000" opacity="0.8">┌ SCUDERIA KHERCHACHE</text>
  <text x="1160" y="36" font-family="monospace" font-size="13" fill="#CC0000" opacity="0.8" text-anchor="end">NET: SECURE ┐</text>
  <text x="40" y="255" font-family="monospace" font-size="12" fill="#777">└ USTHB · ALGIERS</text>
  <text x="1160" y="255" font-family="monospace" font-size="12" fill="#777" text-anchor="end">STATUS: READY ┘</text>

  <!-- orbital accent dots -->
  <circle cx="120" cy="70" r="3" fill="#FF3B3B">
    <animate attributeName="opacity" values="0;1;0" dur="3s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="80" r="2.5" fill="#FF3B3B">
    <animate attributeName="opacity" values="0;1;0" dur="3.4s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="200" r="2" fill="#CC0000">
    <animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="1.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="210" r="2.5" fill="#CC0000">
    <animate attributeName="opacity" values="0;1;0" dur="3.1s" begin="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- name -->
  <text x="600" y="128" text-anchor="middle" font-family="'Fira Code', monospace" font-size="50" font-weight="700" fill="#F8F0F3" filter="url(#agkGlow)">ABDELOUAHID KHERCHACHE</text>

  <!-- glowing underline -->
  <rect x="340" y="148" width="520" height="4" rx="2" fill="#FF3B3B" filter="url(#agkGlow)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
  </rect>

  <!-- role -->
  <text x="600" y="190" text-anchor="middle" font-family="monospace" font-size="19" letter-spacing="2" fill="#FF3B3B">JUNIOR SOFTWARE ENGINEER</text>
  <text x="600" y="216" text-anchor="middle" font-family="monospace" font-size="14" fill="#999999">Full-Stack &amp; Cybersecurity — BLACK AND YELLOW · USTHB</text>
</svg>
